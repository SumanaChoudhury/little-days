# =========================================================================
# Render Blueprint Specification for MyMemories
# =========================================================================
# Deploy this project directly to Render (https://render.com)
# =========================================================================

services:
  - type: web
    name: mymemories
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
